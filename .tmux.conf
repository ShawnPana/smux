set -g mouse on

# Copy to system clipboard on mouse drag release (cross-platform)
if-shell "command -v pbcopy >/dev/null 2>&1" {
    bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    if-shell "command -v xclip >/dev/null 2>&1" {
        bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    } {
        bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
        bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
    }
}

# Scroll enters copy mode automatically, exits when you reach the bottom
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Pane navigation (no prefix needed, Option+ijkl, no wrap)
bind -n M-j if -F '#{pane_at_left}' '' 'select-pane -L'
bind -n M-l if -F '#{pane_at_right}' '' 'select-pane -R'
bind -n M-i if -F '#{pane_at_top}' '' 'select-pane -U'
bind -n M-k if -F '#{pane_at_bottom}' '' 'select-pane -D'

# Pane management (no prefix needed)
bind -n M-n split-window -h -c "#{pane_current_path}" \; select-layout tiled
bind -n M-w kill-pane
bind -n M-o next-layout
bind -n M-g select-pane -m
bind -n M-y run 'tmux swap-pane -s \{marked\} && tmux select-pane -M'

# Swap current pane with neighbor in a direction (Option+Shift+ijkl, no wrap).
# -d keeps focus on your pane so it feels like the pane moves with you.
bind -n M-I if -F '#{pane_at_top}'    '' 'swap-pane -d -t "{up-of}"'
bind -n M-K if -F '#{pane_at_bottom}' '' 'swap-pane -d -t "{down-of}"'
bind -n M-J if -F '#{pane_at_left}'   '' 'swap-pane -d -t "{left-of}"'
bind -n M-L if -F '#{pane_at_right}'  '' 'swap-pane -d -t "{right-of}"'

# Undo/redo pane resizing (Option+z / Option+Shift+z).
# Records layout geometry on every change; undo/redo step through resize history.
# Note: can't undo across a split/swap/close (tmux can't re-add or reorder panes).
set-hook -g window-layout-changed 'run-shell "~/.smux/bin/smux-layout record #{window_id}"'
bind -n M-z run-shell "~/.smux/bin/smux-layout undo"
bind -n M-Z run-shell "~/.smux/bin/smux-layout redo"

# Window navigation (Option+u = next, Option+h = previous)
bind -n M-u if -F '#{window_end_flag}' '' 'next-window'
bind -n M-h if -F '#{window_start_flag}' '' 'previous-window'
bind -n M-m new-window

# Move current window forward/back in the list (Option+Shift+u / Option+Shift+h, no wrap).
# -d keeps focus on your window so it moves with you.
bind -n M-U if -F '#{window_end_flag}'   '' 'swap-window -d -t +1'
bind -n M-H if -F '#{window_start_flag}' '' 'swap-window -d -t -1'

# Toggle the status bar / navbar (Option+s).
# Avoid M-b / M-f: macOS sends Option+Left/Right as ESC b / ESC f (word nav).
bind -n M-s set -g status

# Scroll mode: Option+Tab to enter, i/k to scroll up/down, q or Escape to exit
bind -n M-Tab if -F '#{pane_in_mode}' 'send-keys -X cancel' 'copy-mode'
bind -T copy-mode i send-keys -X -N 2 scroll-up
bind -T copy-mode k send-keys -X -N 2 scroll-down
bind -T copy-mode I send-keys -X halfpage-up
bind -T copy-mode K send-keys -X halfpage-down

# Increase scrollback
set -g history-limit 10000

# Keep window numbers contiguous starting at 1 (renumber on close)
set -g base-index 1
set -g renumber-windows on

# Red pane borders with full box around each pane
set -g pane-border-style fg=colour236
set -g pane-active-border-style fg=red
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g allow-rename off
set -g pane-border-format " #{?@name,#{@name},#{b:pane_current_path}} "
set -g pane-border-status top

# Status bar showing window number and name
set -g status on
set -g status-style bg=default,fg=colour245
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg=red,bold
set -g status-left ""
set -g status-right ""
